<!DOCTYPE html>
<!--
============================================================
メンバー自己紹介ページ
============================================================
🦈🦈🦈🦈🦈🦈🦈🦈🦈🦈🦈🦈🦈🦈🦈🦈🦈🦈🦈🦈🦈🦈🦈🦈🦈🦈


人の手で編集するときは、主に2か所だけ触ればOKです。

1) メンバーの追加・変更・削除
→ ファイル下部のスクリプト内「★ 編集ここから ★」の
MEMBERS 配列を書き換えてください。
1人分は {...} のブロックです。コピーして増やせます。

2) 活動名・サブタイトル
→ 同じくスクリプト内の SITE 設定を書き換えてください。

画像を使いたい場合は、メンバー画像をこのHTMLと同じ場所に置き、
image: "photo.jpg" のようにファイル名を書いてください。
image を空 "" にすると、イニシャルのアイコンが自動表示されます。

SNSリンクは各メンバーの sns、作品集は portfolio に書きます。
url が空 "" の間はページに表示されません。

外部ライブラリ不使用 / このファイル1つだけで動きます。
============================================================
-->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>メンバー紹介</title>
<style>
:root{
--bg:#071a26; --bg2:#0b2a3d;
--card:#0e3047; --card2:#123a54;
--line:rgba(255,255,255,.12);
--text:#eef7fb; --muted:#a9c6d4;
--accent:#39c2d7; --accent2:#7ee0f0;
--radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
color:var(--text); line-height:1.7;
background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 55%,#08202f 100%);
min-height:100vh;
}
a{color:var(--accent2)}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px 64px}

/* ---------- ヘッダー ---------- */
header{ text-align:center; padding:64px 20px 36px;}
.eyebrow{
display:inline-block; font-size:.8rem; letter-spacing:.22em;
color:var(--accent2); border:1px solid var(--line);
padding:4px 14px; border-radius:999px; margin-bottom:18px;
}
h1{ font-size:clamp(1.9rem,5vw,3rem); line-height:1.25; font-weight:800;}
.subtitle{ color:var(--muted); margin-top:12px; font-size:clamp(.95rem,2.5vw,1.05rem);}
.about{
max-width:720px; margin:22px auto 0; color:var(--muted);
font-size:.95rem; text-align:left;
background:rgba(255,255,255,.04); border:1px solid var(--line);
border-radius:var(--radius); padding:16px 20px;
}
</style>
<style>
  /* ---------- メンバーカード ---------- */
  .grid{
    display:grid; gap:22px; margin-top:36px;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  }
  .card{
    background:linear-gradient(180deg,var(--card2),var(--card));
    border:1px solid var(--line); border-radius:var(--radius);
    padding:26px 24px; display:flex; flex-direction:column; gap:12px;
  }
  .avatar{
    width:84px; height:84px; border-radius:50%; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    background:var(--member-color,#39c2d7); color:#04222e;
    font-size:1.9rem; font-weight:800; flex:none;
  }
  .avatar img{ width:100%; height:100%; object-fit:cover; display:block; }
  .code{
    font-size:.78rem; letter-spacing:.14em; font-weight:700;
    color:var(--member-color,var(--accent));
  }
  .name{ font-size:1.35rem; font-weight:800; line-height:1.3; }
  .role{ color:var(--accent2); font-size:.92rem; font-weight:600; }
  .tagline{ font-size:.95rem; }
  .bio{ color:var(--muted); font-size:.9rem; white-space:pre-line; }
  .label{ font-size:.75rem; letter-spacing:.14em; color:var(--muted); margin-top:4px; }
  .tags{ display:flex; flex-wrap:wrap; gap:8px; }
  .tag{
    font-size:.8rem; padding:3px 11px; border-radius:999px;
    border:1px solid var(--line); background:rgba(255,255,255,.05);
  }
  .links{ display:flex; flex-wrap:wrap; gap:10px; margin-top:auto; padding-top:6px; }
  .links a{
    font-size:.85rem; text-decoration:none; font-weight:600;
    border:1px solid var(--line); border-radius:999px; padding:5px 14px;
  }
  .links a:hover{ border-color:var(--accent); }
  .sns{ display:flex; flex-wrap:wrap; gap:8px; }
  .sns a{
    font-size:.85rem; text-decoration:none; font-weight:700;
    border:1px solid var(--line); border-radius:999px; padding:5px 14px;
    background:rgba(255,255,255,.06);
  }
  .sns a:hover{ border-color:var(--accent); }
  .portfolio{ display:flex; flex-direction:column; gap:10px; }
  .work{
    border:1px solid var(--line); border-radius:12px;
    padding:10px 14px; background:rgba(255,255,255,.04);
  }
  .work a{ font-weight:700; text-decoration:none; }
  .work a:hover{ text-decoration:underline; }
  .work-title{ font-weight:700; font-size:.92rem; }
  .work-note{ color:var(--muted); font-size:.85rem; margin-top:2px; }
  .empty{
    text-align:center; color:var(--muted);
    border:1px dashed var(--line); border-radius:var(--radius);
    padding:40px 20px; margin-top:36px;
  }
  footer{
    text-align:center; color:var(--muted);
    font-size:.82rem; padding:36px 20px 8px;
  }
  @media (max-width:520px){
    header{ padding-top:44px; }
    .card{ padding:22px 18px; }
  }
</style>
</head>
<body>
  <header>
    <span class="eyebrow" id="site-eyebrow"></span>
    <h1 id="site-title"></h1>
    <p class="subtitle" id="site-subtitle"></p>
    <div class="about" id="site-about" hidden></div>
  </header>

  <main class="wrap">
    <!-- メンバーカードは下の MEMBERS データから自動生成されます -->
    <section class="grid" id="member-grid" aria-label="メンバー一覧"></section>
    <div class="empty" id="member-empty" hidden>メンバーは準備中です。</div>
  </main>

  <footer id="site-footer"></footer>

<script>
/* ============================================================
   ★ 編集ここから ★
   ============================================================ */

/* ---------- サイト全体の設定 ---------- */
const SITE = {
  eyebrow: "MEMBERS",                 // タイトル上の小さいラベル
  title: "メンバー紹介",               // ページのタイトル
  subtitle: "Shiver of Sharks Creators",  // タイトルの下の一行（不要なら "" ）
  // 活動の説明文（不要なら "" ）
  about: "",
  footer: "",                         // フッターの一行（不要なら "" ）
};

/* ---------- メンバー一覧 ----------
   1人分 = { ... } のブロックです。
   ・増やす : ブロックをコピーして中身を書き換える
   ・減らす : ブロックごと消す（最後のブロック以外は末尾の , を残す）
   ・空欄OK : tagline / bio / tags / links / image は空にできます

   name      : 名前（表示名）
   code      : 略称・肩書きコード（例: RSE / SSD）
   role      : 役割（例: Ray System Engineer）
   tagline   : 一言紹介
   bio       : 自己紹介文（改行したい場所で \n と書く）
   tags      : 得意なこと・担当など。["", ""] の形で並べる
   image     : 画像ファイル名 or URL。空 "" ならイニシャル表示
   color     : アイコンやアクセントの色（カラーコード）
   sns       : SNSリンク。[{ label: "X", url: "https://..." }] の形
               url を空 "" にするとその項目は表示されません
   portfolio : ポートフォリオ / 作品リンク
               [{ title: "作品名", url: "https://...", note: "説明" }] の形
               title と url の両方が空の間は表示されません
   links     : その他のリンク（旧形式）。[{ label: "表示名", url: "https://..." }]
-------------------------------------- */
const MEMBERS = [
 
  {
    name: "あると",
    code: "SCD",
    role: "Shark Concept Designer",
    tagline: "",
    bio: "",
    tags: ["コンセプト", "デザイン" ,"生き物飼育"],
    image: "",
    color: "#7ee0f0",
    sns: [
      { label: "X", url: "" },
      { label: "Facebook", url: "https://www.facebook.com/profile.php?id=61583199273025" },
      { label: "Instagram", url: "" },
      { label: "YouTube", url: "" },
    ],
    portfolio: [
      { title: "", url: "", note: "" },
    ],
    links: [],
  },
 {
    name: "レイ",
    code: "RSE",
    role: "Ray System Engineer",
    tagline: "",
    bio: "",
    tags: ["システム", "エンジニアリング" ,"AI"],
    image: "",
    color: "#39c2d7",
    sns: [
      { label: "X", url: "" },
      { label: "Instagram", url: "" },
      { label: "YouTube", url: "" },
    ],
    portfolio: [
      { title: "", url: "", note: "" },
    ],
    links: [],
  },
  {
    name: "（名前を入力）",
    code: "SMA",
    role: "Shark Maker Artist",
    tagline: "",
    bio: "",
    tags: ["モデリング", "ぬいぐるみ制作"],
    image: "",
    color: "#5ad1a0",
    sns: [
      { label: "X", url: "" },
      { label: "Instagram", url: "" },
      { label: "YouTube", url: "" },
    ],
    portfolio: [
      { title: "", url: "", note: "" },
    ],
    links: [],
  },
  {
    name: "（名前を入力）",
    code: "SSD",
    role: "Shark Sound Designer",
    tagline: "",
    bio: "",
    tags: ["作曲", "編曲"],
    image: "",
    color: "#f0b35e",
    sns: [
      { label: "X", url: "" },
      { label: "Instagram", url: "" },
      { label: "YouTube", url: "" },
      { label: "SoundCloud", url: "" },
    ],
    portfolio: [
      { title: "", url: "", note: "" },
    ],
    links: [],
  },
];

/* ============================================================
   ★ 編集ここまで ★
   以下は表示用の処理です。基本的に触らなくて大丈夫です。
   ============================================================ */
</script>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
    (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  // サイト情報の反映
  document.title = SITE.title || "メンバー紹介";
  document.getElementById("site-eyebrow").textContent = SITE.eyebrow || "";
  document.getElementById("site-title").textContent = SITE.title || "";
  document.getElementById("site-subtitle").textContent = SITE.subtitle || "";
  const aboutEl = document.getElementById("site-about");
  if (SITE.about) { aboutEl.textContent = SITE.about; aboutEl.hidden = false; }
  document.getElementById("site-footer").textContent = SITE.footer || "";

  // メンバーカードの生成
  const grid = document.getElementById("member-grid");
  document.getElementById("member-empty").hidden = MEMBERS.length > 0;

  MEMBERS.forEach((m) => {
    const card = document.createElement("article");
    card.className = "card";
    if (m.color) card.style.setProperty("--member-color", m.color);

    const initial = esc((m.name || "?").trim().charAt(0) || "?");
    const avatar = m.image
      ? `<div class="avatar"><img src="${esc(m.image)}" alt="${esc(m.name)}"></div>`
      : `<div class="avatar" aria-hidden="true">${initial}</div>`;

    const tags = (m.tags || []).filter(Boolean).map((t) =>
      `<span class="tag">${esc(t)}</span>`).join("");
    const sns = (m.sns || []).filter((l) => l && l.url).map((l) =>
      `<a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.label || l.url)}</a>`).join("");
    const works = (m.portfolio || []).filter((w) => w && (w.title || w.url)).map((w) => {
      const title = esc(w.title || w.url);
      const head = w.url
        ? `<a href="${esc(w.url)}" target="_blank" rel="noopener noreferrer">${title}</a>`
        : `<span class="work-title">${title}</span>`;
      return `<div class="work">${head}${w.note ? `<div class="work-note">${esc(w.note)}</div>` : ""}</div>`;
    }).join("");
    const links = (m.links || []).filter((l) => l && l.url).map((l) =>
      `<a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.label || l.url)}</a>`).join("");

    card.innerHTML = `
      ${avatar}
      ${m.code ? `<div class="code">${esc(m.code)}</div>` : ""}
      <div>
        <div class="name">${esc(m.name)}</div>
        ${m.role ? `<div class="role">${esc(m.role)}</div>` : ""}
      </div>
      ${m.tagline ? `<p class="tagline">${esc(m.tagline)}</p>` : ""}
      ${m.bio ? `<p class="bio">${esc(m.bio)}</p>` : ""}
      ${tags ? `<div><div class="label">担当・得意なこと</div><div class="tags">${tags}</div></div>` : ""}
      ${sns ? `<div><div class="label">SNS</div><div class="sns">${sns}</div></div>` : ""}
      ${works ? `<div><div class="label">ポートフォリオ</div><div class="portfolio">${works}</div></div>` : ""}
      ${links ? `<div class="links">${links}</div>` : ""}
    `;
    grid.appendChild(card);
  });
</script>
</body>
</html>
